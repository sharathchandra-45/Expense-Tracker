<!DOCTYPE html>
<html>
<head>
    <title>{{ category }} Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <a href="/home">Home</a>
    <a href="/">Logout</a>
</div>

<div class="container">

    <h2>{{ category }} Expenses</h2>

    <h3>Add New Expense</h3>

    <form method="POST">
        <input type="text" name="title" placeholder="Expense Title" required>
        <input type="num" name="amount" placeholder="Amount" required>
        <input type="date" name="date" required>
        <button type="submit">Add Expense</button>
    </form>

    <hr>

    <h3>Expense History</h3>

    <table border="1" width="100%">
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Date</th>
        </tr>

        {% for e in expenses %}
        <tr>
            <td>{{ e[1] }}</td>
            <td>₹ {{ e[3] }}</td>
            <td>{{ e[4] }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
